<body>
    <div class="player-container">
        <div class="cassette-player">
            <div class="cassette">
                <div class="reels">
                    <div class="reel" id="reel-left">
                        <div class="spoke"></div>
                        <div class="spoke"></div>
                        <div class="spoke"></div>
                        <div class="spoke"></div>
                        <div class="spoke"></div>
                        <div class="spoke"></div>
                    </div>

                        <div class="spoke"></div>
                        <div class="spoke"></div>
                        <div class="spoke"></div>
                        <div class="spoke"></div>
                        <div class="spoke"></div>
                    </div>
                </div>
            </div>
            <div id="track-title"></div>
            <div class="controls">
                <button type="button" id="prev-btn">⏮ Prev</button>
                <button type="button" id="play-pause-btn">▶ Play</button>
                <button type="button" id="next-btn">⏭ Next</button>
            </div>
        </div>

        <div class="track-list">
            <div class="j-card" id="j-card">
                <!-- Tracks will be populated here -->
            </div>
        </div>
    </div>
