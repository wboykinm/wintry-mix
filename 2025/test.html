<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wintry Mix player tests</title>
    <style>
        body { font-family: monospace; padding: 1em; }
        .pass { color: green; }
        .fail { color: crimson; white-space: pre-wrap; }
    </style>
</head>

<body>
    <h3>nextPlayer.js tests</h3>
    <p id="summary">running…</p>
    <ul id="results"></ul>

    <script src="nextPlayer.js"></script>
    <script>
        // Minimal stand-in for HTMLAudioElement that follows the spec's load/play/pause rules:
        // assigning src runs load(), which silently pauses and rejects pending play() promises with AbortError.
        class FakeAudio extends EventTarget {
            constructor() {
                super();
                this.paused = true;
                this.ended = false;
                this.error = null;
                this.loadCount = 0;
                this.blockPlay = false;
                this._src = '';
                this._pending = [];
            }
            get src() { return this._src; }
            set src(value) { this._src = value; this.load(); }
            load() {
                this.loadCount++;
                this.error = null;
                this.ended = false;
                this.paused = true;
                this._rejectPending('AbortError');
            }
            play() {
                if (this.blockPlay) return Promise.reject(new DOMException('blocked', 'NotAllowedError'));
                const wasPaused = this.paused;
                this.paused = false;
                if (wasPaused) this._fire('play');
                return new Promise((resolve, reject) => this._pending.push({ resolve, reject }));
            }
            pause() {
                if (!this.paused) {
                    this.paused = true;
                    this._fire('pause');
                }
                this._rejectPending('AbortError');
            }
            // --- test controls ---
            startPlaying() {
                this._pending.splice(0).forEach(p => p.resolve());
                this._fire('playing');
            }
            stall() { this._fire('waiting'); }
            finish() {
                this.paused = true;
                this.ended = true;
                this._fire('pause');
                this._fire('ended');
            }
            failLoad() {
                this.error = { code: 2 };
                this._fire('error');
                this._rejectPending('NotSupportedError');
            }
            _rejectPending(name) {
                this._pending.splice(0).forEach(p => p.reject(new DOMException(name, name)));
            }
            _fire(type) { setTimeout(() => this.dispatchEvent(new Event(type))); }
        }

        const unhandled = [];
        window.addEventListener('unhandledrejection', e => { unhandled.push(e.reason); e.preventDefault(); });

        const tick = () => new Promise(r => setTimeout(r, 0));
        const settle = async () => { await tick(); await tick(); };

        function assertEq(actual, expected, msg) {
            if (actual !== expected) throw new Error(`${msg}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
        }

        function setup() {
            const audio = new FakeAudio();
            const titleEl = document.createElement('div');
            const playPauseBtn = document.createElement('button');
            const reels = [document.createElement('div'), document.createElement('div')];
            const tracks = [
                { order: 1, artist: 'A', song: 'One', url: 'https://example.com/1.mp3?dl=0' },
                { order: 2, artist: 'B', song: 'Two', url: 'https://example.com/2.mp3' },
                { order: 3, artist: 'C', song: 'Three', url: 'https://example.com/3.mp3' },
            ];
            const player = createPlayer({ audio, tracks, titleEl, playPauseBtn, reels });
            const ui = () => ({
                button: playPauseBtn.textContent,
                reels: reels.map(r => r.style.animationPlayState).join(','),
                title: titleEl.textContent,
            });
            const expectPlaying = (msg = 'state') => {
                assertEq(player.isPlaying, true, `${msg} isPlaying`);
                assertEq(audio.paused, false, `${msg} audio.paused`);
                assertEq(ui().button, '⏸ Pause', `${msg} button`);
            };
            const expectStopped = (msg = 'state') => {
                assertEq(player.isPlaying, false, `${msg} isPlaying`);
                assertEq(audio.paused, true, `${msg} audio.paused`);
                assertEq(ui().button, '▶ Play', `${msg} button`);
                assertEq(ui().reels, 'paused,paused', `${msg} reels`);
            };
            return { audio, player, tracks, ui, expectPlaying, expectStopped };
        }

        const tests = [];
        const test = (name, fn) => tests.push({ name, fn });

        test('initial state loads track 1 stopped, forcing dl=1', async () => {
            const { audio, player, ui, expectStopped } = setup();
            assertEq(player.currentTrack, 0, 'track');
            assertEq(ui().title, 'One - A', 'title');
            assertEq(new URL(audio.src).searchParams.get('dl'), '1', 'dl param');
            assertEq(audio.loadCount, 1, 'loads once');
            expectStopped();
        });

        test('play then pause', async () => {
            const { audio, player, ui, expectPlaying, expectStopped } = setup();
            player.togglePlay();
            audio.startPlaying();
            await settle();
            expectPlaying();
            assertEq(ui().reels, 'running,running', 'reels');
            player.togglePlay();
            await settle();
            expectStopped();
        });

        test('next/prev while paused change track without playing, loading once each', async () => {
            const { audio, player, ui, expectStopped } = setup();
            player.nextTrack();
            assertEq(player.currentTrack, 1, 'after next');
            assertEq(ui().title, 'Two - B', 'title');
            assertEq(audio.loadCount, 2, 'single load per change');
            player.prevTrack();
            player.prevTrack();
            assertEq(player.currentTrack, 2, 'prev wraps to last');
            await settle();
            expectStopped();
        });

        test('rapid next while play is still pending keeps playing with no errors', async () => {
            const { audio, player, expectPlaying } = setup();
            player.togglePlay();
            player.nextTrack();
            player.nextTrack();
            player.prevTrack();
            player.nextTrack();
            await settle();
            assertEq(player.currentTrack, 2, 'track');
            expectPlaying();
            audio.startPlaying();
            await settle();
            expectPlaying('after audio starts');
            assertEq(unhandled.length, 0, 'unhandled rejections');
        });

        test('pause while play is pending stops cleanly', async () => {
            const { player, expectStopped } = setup();
            player.togglePlay();
            player.togglePlay();
            await settle();
            expectStopped();
            assertEq(unhandled.length, 0, 'unhandled rejections');
        });

        test('blocked play() reverts UI instead of hanging on "Pause"', async () => {
            const { audio, player, expectStopped, expectPlaying } = setup();
            audio.blockPlay = true;
            player.togglePlay();
            await settle();
            expectStopped('after blocked play');
            player.nextTrack();
            await settle();
            expectStopped('next after blocked play');
            audio.blockPlay = false;
            player.togglePlay();
            await settle();
            expectPlaying('retry');
        });

        test('load error stops playback, shows message, and Play retries the track', async () => {
            const { audio, player, ui, expectStopped, expectPlaying } = setup();
            player.togglePlay();
            audio.failLoad();
            await settle();
            assertEq(player.isPlaying, false, 'isPlaying');
            assertEq(ui().button, '▶ Play', 'button');
            assertEq(ui().title.startsWith('⚠'), true, 'error message');
            const loads = audio.loadCount;
            player.togglePlay();
            await settle();
            assertEq(audio.loadCount, loads + 1, 'reloads on retry');
            assertEq(ui().title, 'One - A', 'title restored');
            expectPlaying('after retry');
            assertEq(unhandled.length, 0, 'unhandled rejections');
        });

        test('buffering pauses reels but keeps Pause button', async () => {
            const { audio, player, ui } = setup();
            player.togglePlay();
            audio.startPlaying();
            await settle();
            audio.stall();
            await settle();
            assertEq(ui().button, '⏸ Pause', 'button');
            assertEq(ui().reels, 'paused,paused', 'reels while buffering');
            audio.startPlaying();
            await settle();
            assertEq(ui().reels, 'running,running', 'reels resume');
        });

        test('external pause/play (media keys) syncs the UI', async () => {
            const { audio, player, expectPlaying, expectStopped } = setup();
            player.togglePlay();
            audio.startPlaying();
            await settle();
            audio.pause();
            await settle();
            expectStopped('external pause');
            audio.play();
            await settle();
            expectPlaying('external play');
        });

        test('track end auto-advances, last track end rewinds and stops', async () => {
            const { audio, player, expectPlaying, expectStopped } = setup();
            player.togglePlay();
            audio.startPlaying();
            await settle();
            audio.finish();
            await settle();
            assertEq(player.currentTrack, 1, 'advanced');
            expectPlaying('after advance');
            player.nextTrack();
            audio.startPlaying();
            await settle();
            audio.finish();
            await settle();
            assertEq(player.currentTrack, 0, 'rewound');
            expectStopped('after last track');
        });

        (async () => {
            const results = document.getElementById('results');
            let failed = 0;
            for (const { name, fn } of tests) {
                unhandled.length = 0;
                const li = document.createElement('li');
                try {
                    await fn();
                    li.className = 'pass';
                    li.textContent = `✔ ${name}`;
                } catch (err) {
                    failed++;
                    li.className = 'fail';
                    li.textContent = `✘ ${name}\n   ${err.message}`;
                }
                results.appendChild(li);
            }
            const summary = document.getElementById('summary');
            summary.textContent = `${tests.length - failed} passed, ${failed} failed`;
            summary.dataset.failed = failed;
            summary.className = failed ? 'fail' : 'pass';
        })();
    </script>
</body>

</html>
